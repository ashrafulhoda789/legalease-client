<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Amber Background -->
  <rect width="512" height="512" rx="128" fill="#D97706" />

  <!-- White Scale Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Pillar -->
    <line x1="256" y1="120" x2="256" y2="392" />
    
    <!-- Top Beam -->
    <line x1="130" y1="160" x2="382" y2="160" />
    
    <!-- Base -->
    <line x1="180" y1="392" x2="332" y2="392" />
    
    <!-- Left Scale Pan Strings -->
    <polyline points="130,160 90,270 170,270 130,160" />
    <!-- Left Scale Bowl -->
    <path d="M 90,270 A 40,40 0 0,0 170,270 Z" />

    <!-- Right Scale Pan Strings -->
    <polyline points="382,160 342,270 422,270 382,160" />
    <!-- Right Scale Bowl -->
    <path d="M 342,270 A 40,40 0 0,0 422,270 Z" />
  </g>
</svg>
